  # ------------------------------------------------------------------ Admin
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [student, advisor, admin] }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, suspended] }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated users (no hashes or tokens).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SafeUser' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a user
      description: Student/advisor profiles are created in the same transaction. A temporary password is generated when none is supplied and the account must change it.
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, fullName, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                fullName: { type: string, minLength: 2, maxLength: 200 }
                role: { type: string, enum: [student, advisor, admin] }
                phone: { type: string, maxLength: 30 }
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: Optional; generated when omitted.
                isDemo: { type: boolean }
                student:
                  type: object
                  additionalProperties: false
                  required: [studentCode, program]
                  properties:
                    studentCode: { type: string, pattern: '^[0-9]{6,15}$' }
                    program: { type: string, enum: [CS, IT, AI, DS] }
                    level: { type: integer, minimum: 1, maximum: 4 }
                    advisorId: { type: [string, 'null'], format: uuid }
                    departmentId: { type: [string, 'null'], format: uuid }
                    admissionTerm: { type: [string, 'null'], maxLength: 40 }
                    cgpa: { type: number, minimum: 0, maximum: 4 }
                    passedCredits: { type: integer, minimum: 0, maximum: 300 }
                    transferCredits: { type: integer, minimum: 0, maximum: 54 }
                advisor:
                  type: object
                  additionalProperties: false
                  properties:
                    departmentId: { type: [string, 'null'], format: uuid }
                    officeLocation: { type: [string, 'null'], maxLength: 200 }
                    maxStudents: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SafeUser' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Update a user's name, phone or status
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
