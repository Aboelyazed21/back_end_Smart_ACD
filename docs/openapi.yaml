          schema: { type: string, enum: [open, resolved] }
        - name: severity
          in: query
          schema: { type: string, enum: [blocking, warning, info] }
        - name: type
          in: query
          schema: { type: string, maxLength: 60 }
        - name: course
          in: query
          schema: { type: string, pattern: '^[A-Z]{3}[0-9]{4}$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated anomalies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Anomaly' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/admin/anomalies/{id}:
    get:
      tags: [Admin]
      summary: Anomaly detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^A-[A-Z]+-[0-9]{2}$' }
      responses:
        '200':
          description: Anomaly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Anomaly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/anomalies/{id}/resolve:
    patch:
      tags: [Admin]
      summary: Resolve an anomaly, re-evaluate affected decisions and audit it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^A-[A-Z]+-[0-9]{2}$' }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolvedValue]
              properties:
                resolvedValue: { type: string, minLength: 2, maxLength: 5000 }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Resolution summary with re-evaluation counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reEvaluated: { type: integer }
                      autoResolved: { type: integer }
                      stillReview: { type: integer }
                      errors:
                        type: array
                        items: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/anomalies/{id}/reopen:
    post:
      tags: [Admin]
      summary: Reopen a resolved anomaly with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^A-[A-Z]+-[0-9]{2}$' }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Reopened anomaly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Anomaly' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/regulation/rules:
    get:
      tags: [Admin]
      summary: List regulation rules
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [active, superseded] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/admin/regulation/rules/{code}:
    get:
      tags: [Admin]
      summary: Rule detail with article, clause and page
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 40 }
      responses:
        '200':
          description: Rule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Query the append-only audit log
      parameters:
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: entityType
          in: query
          schema: { type: string, maxLength: 60 }
        - name: entityId
          in: query
          schema: { type: string, maxLength: 100 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated audit records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/admin/escalations:
    get:
      tags: [Admin]
      summary: List escalations
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, in_review, resolved, closed] }
        - name: type
          in: query
          schema:
            type: string
            enum: [RULE_ENGINE, PLAN_REVIEW, ACADEMIC, ANOMALY, IMPORT, OTHER]
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high, critical] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated escalations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Escalation' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/admin/escalations/{id}:
    patch:
      tags: [Admin]
      summary: Update or assign an escalation
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [open, in_review, resolved, closed] }
                priority: { type: string, enum: [low, medium, high, critical] }
                resolution: { type: string, minLength: 3, maxLength: 5000 }
                assignedTo: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Updated escalation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Escalation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/analytics/overview:
    get:
      tags: [Admin]
      summary: Institution-wide totals
      responses:
        '200':
          description: Overview metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/admin/analytics/bottlenecks:
    get:
      tags: [Admin]
      summary: Courses blocking the most students
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Bottleneck ranking.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
  /api/admin/analytics/enrollments:
    get:
      tags: [Admin]
      summary: Enrollment trends
      responses:
        '200':
          description: Enrollment series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/admin/analytics/escalations:
    get:
      tags: [Admin]
      summary: Escalation volume by type and status
      responses:
        '200':
          description: Escalation series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/admin/analytics/plans:
    get:
      tags: [Admin]
      summary: Plan status distribution
      responses:
        '200':
          description: Plan series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/admin/imports/students:
    post:
      tags: [Admin]
      summary: Import students from CSV
      description: |
        Multipart upload, field `file`. Headers are validated; up to 5,000 rows;
        per-row errors are stored without aborting the whole file. Imported
        accounts get a random temporary password and must reset it.
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Import accepted for processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/admin/imports/transcripts:
    post:
      tags: [Admin]
      summary: Import transcript rows from CSV
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Import accepted; official totals are recomputed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/admin/imports:
    get:
      tags: [Admin]
      summary: List import jobs
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [students, transcripts] }
        - name: status
          in: query
          schema: { type: string, enum: [pending, processing, completed, failed] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated import jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ImportJob' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/admin/imports/{id}:
    get:
      tags: [Admin]
      summary: Import job detail
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/imports/{id}/errors:
    get:
      tags: [Admin]
      summary: Per-row import errors
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Row errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------- Chat
  /api/chat/sessions:
    get:
      tags: [Chat]
      summary: List own chat sessions
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chat]
      summary: Create a chat session
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/chat/sessions/{id}:
    get:
      tags: [Chat]
      summary: Get a session with its messages
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chat/sessions/{id}/messages:
    post:
      tags: [Chat]
      summary: Ask a policy question (RAG)
      description: |
        Answers are extractive from stored bylaw chunks and always carry
        citations. Low confidence or open-anomaly topics return an escalation
        instead of an answer. Numeric questions are answered by the rule engine.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 2, maxLength: 1500 }
                language: { type: string, enum: [ar, en, auto] }
      responses:
        '200':
          description: Answer with citations, or an escalation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChatAnswer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived (<= 15 minutes) HS256 access token.
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Must equal the `csrf_token` cookie set by `GET /api/auth/csrf`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: httpOnly, SameSite=Strict rotating refresh token.
  responses:
    Unauthorized:
      description: Missing, expired or invalid access token, or inactive account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not allowed (RBAC, object-level check or CSRF).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Zod validation failure; unknown keys are rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Duplicate resource or invalid state transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Unexpected error; details are never exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Term:
      name: term
      in: query
      description: Optional term; defaults to the current academic term.
      schema: { type: string, example: '2026-2027-fall' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseCode:
      name: courseCode
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{3}[0-9]{4}$' }
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: true
      schema: { type: string }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            correlationId:
              type: string
    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 0 }
    SafeUser:
      type: object
      description: User object with password hashes and tokens removed.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [student, advisor, admin] }
        status: { type: string, enum: [active, inactive, suspended] }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        mustChangePassword: { type: boolean }
        isDemo: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Decision:
      type: object
      description: |
        Deterministic rule-engine decision. `REVIEW_REQUIRED` means a blocking
        anomaly or missing data prevented a safe decision; an escalation is
        created automatically.
      required: [status, rule_code, article, page, reason_ar, reason_en]
      properties:
        status:
          type: string
          enum: [ELIGIBLE, NOT_ELIGIBLE, UNKNOWN, REVIEW_REQUIRED]
        course_code: { type: string, example: CSB2101 }
        rule_code: { type: string, example: R-PREREQ-09.2 }
        article: { type: string, example: '9' }
        clause: { type: [string, 'null'] }
        page: { type: [integer, string], example: 8 }
        reason_ar: { type: string }
        reason_en: { type: string }
        anomaly_ids:
          type: array
          items: { type: string, example: A-CAT-09 }
        details:
          type: object
          additionalProperties: true
        advisoryOnly:
          type: boolean
          const: true
    PlanItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        course_code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        credits: { type: integer }
        position: { type: integer }
        eligibility_status:
          type: string
          enum: [ELIGIBLE, NOT_ELIGIBLE, UNKNOWN, REVIEW_REQUIRED]
        rule_code: { type: string }
        article: { type: string }
        page: { type: [integer, string] }
        anomaly_ids:
          type: array
          items: { type: string }
        meeting_times:
          type: array
          items:
            type: object
            additionalProperties: true
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        term: { type: string, example: '2026-2027-fall' }
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, MODIFIED, REJECTED]
        total_credits: { type: integer }
        max_credits: { type: integer, description: Resolved load cap. }
        load_decision: { $ref: '#/components/schemas/Decision' }
        load_anomaly_ids:
          type: array
          items: { type: string }
        advisory_only: { type: boolean, const: true }
        note: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlanItem' }
        excluded:
          type: array
          items: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EligibilityResponse:
      type: object
      properties:
        term: { type: string }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/Decision' }
        plannedCredits: { type: integer }
        loadDecision: { $ref: '#/components/schemas/Decision' }
        escalations:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              ticketNo: { type: string }
              status: { type: string }
        advisoryOnly: { type: boolean, const: true }
    Citation:
      type: object
      properties:
        chunk_id: { type: string, format: uuid }
        article: { type: [string, 'null'] }
        clause: { type: [string, 'null'] }
        page: { type: integer }
        source: { type: string, example: 'BUA-AIDM.pdf#page=8' }
        text: { type: string }
    ChatAnswer:
      type: object
      properties:
        answer_ar: { type: string }
        answer_en: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        escalated: { type: boolean }
        escalation_id: { type: [string, 'null'], format: uuid }
        rule_code: { type: [string, 'null'] }
        advisoryOnly: { type: boolean, const: true }
    Standing:
      type: object
      properties:
        term: { type: string }
        sgpa: { type: number }
        cgpa: { type: number }
        passed_credits: { type: integer }
        level: { type: integer }
        warning_no: { type: integer }
        consecutive_warnings: { type: integer }
        total_warnings: { type: integer }
        probation: { type: boolean }
        dismissal_risk: { type: boolean }
        final_chance: { type: boolean }
        decision: { $ref: '#/components/schemas/Decision' }
        advisoryOnly: { type: boolean, const: true }
    GraduationAudit:
      type: object
      properties:
        term: { type: string }
        passed_credits: { type: integer }
        required_credits: { type: integer, example: 136 }
        cgpa: { type: number }
        eligible_to_graduate: { type: boolean }
        missing:
          type: array
          items: { type: object, additionalProperties: true }
        elective_pools:
          type: array
          items: { type: object, additionalProperties: true }
        advisoryOnly: { type: boolean, const: true }
    EarlyWarning:
      type: object
      properties:
        term: { type: string }
        risk_level: { type: string, enum: [low, medium, high] }
        signals:
          type: array
          items: { type: object, additionalProperties: true }
        recommendations:
          type: array
          items: { type: string }
        advisoryOnly: { type: boolean, const: true }
    StudentProfile:
      type: object
      properties:
        student:
          type: object
          additionalProperties: true
          properties:
            id: { type: string, format: uuid }
            studentCode: { type: string }
            program: { type: string, enum: [CS, IT, AI, DS] }
            level: { type: integer, minimum: 1, maximum: 4 }
            cgpa: { type: number }
            passedCredits: { type: integer }
        department:
          type: [object, 'null']
          additionalProperties: true
        advisor:
          type: [object, 'null']
          additionalProperties: true
        user: { $ref: '#/components/schemas/SafeUser' }
    Course:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
        credits: { type: integer }
        category: { type: string }
        counts_in_gpa: { type: boolean }
        level_hint: { type: integer }
        term_hint: { type: integer }
        active: { type: boolean }
        anomaly_ids:
          type: array
          items: { type: string }
        prerequisites:
          type: array
          items: { type: object, additionalProperties: true }
    Department:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_ar: { type: string }
        name_en: { type: string }
    Advisor:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        departmentId: { type: [string, 'null'], format: uuid }
        officeLocation: { type: [string, 'null'] }
        maxStudents: { type: integer }
    Anomaly:
      type: object
      properties:
        id: { type: string, example: A-REG-01 }
        severity: { type: string, enum: [blocking, warning, info] }
        type: { type: string }
        title_ar: { type: string }
        description_ar: { type: string }
        sources:
          type: array
          items: { type: object, additionalProperties: true }
        affected_courses:
          type: array
          items: { type: string }
        affected_rules:
          type: array
          items: { type: string }
        working_value: { type: [string, 'null'] }
        engine_behavior: { type: string }
        status: { type: string, enum: [open, resolved] }
        resolved_value: { type: [string, 'null'] }
        resolved_by: { type: [string, 'null'], format: uuid }
        resolved_at: { type: [string, 'null'], format: date-time }
    Escalation:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_no: { type: string }
        type: { type: string, enum: [RULE_ENGINE, PLAN_REVIEW, ACADEMIC, ANOMALY, IMPORT, OTHER] }
        priority: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, in_review, resolved, closed] }
        subject: { type: string }
        description: { type: string }
        student_id: { type: [string, 'null'], format: uuid }
        assigned_to: { type: [string, 'null'], format: uuid }
        resolution: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [students, transcripts] }
        status: { type: string, enum: [pending, processing, completed, failed] }
        total_rows: { type: integer }
        success_rows: { type: integer }
        error_rows: { type: integer }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        csrfToken: { type: string }
        user: { $ref: '#/components/schemas/SafeUser' }

