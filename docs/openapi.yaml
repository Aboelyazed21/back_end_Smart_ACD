openapi: 3.1.0
info:
  title: Smart Academic Advisor API
  version: 1.0.0
  description: |
    Advisory academic-planning API for the AIDM programs at Badr University in
    Assiut. The Node API is the only public service; the Python rule engine is
    internal and is never called by the browser.

    **Advisory only.** Generated plans are always `DRAFT`. The API has no
    registration endpoint and cannot override eligibility.

    ## Conventions
    - Success: `{ "data": ... }`; lists add `pagination`.
    - Errors: `{ "error": { "code", "message", "details?", "correlationId" } }`.
    - Send `Authorization: Bearer <accessToken>` on protected routes.
    - Call `GET /api/auth/csrf` first, then send `x-csrf-token` on every
      state-changing request except login and refresh.
    - Terms are canonical `YYYY-YYYY-season` (e.g. `2026-2027-fall`); the parser
      also accepts `fall 2026-2027`.
  contact:
    name: AIDM Smart Academic Advisor
  license:
    name: Internal university project
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://advisor.aidm.bua.edu.eg
    description: Production (example host)
tags:
  - name: Health
  - name: Auth
  - name: Student
  - name: Advisor
  - name: Admin
  - name: Chat
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  uptimeSeconds: { type: integer }
                  version: { type: string }
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Database and rule-engine readiness
      responses:
        '200':
          description: All dependencies are ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        ok: { type: boolean }
                        detail: { type: string }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/auth/csrf:
    get:
      tags: [Auth]
      security: []
      summary: Issue a CSRF token (also sets the csrf_token cookie)
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate and start a refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Authenticated; sets the httpOnly refresh cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/refresh:
    post:
      tags: [Auth]
      security:
        - refreshCookie: []
      summary: Rotate the refresh token and issue a new access token
      responses:
        '200':
          description: Rotated; the previous refresh token is now invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every refresh session for the current user
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: All sessions revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user, student profile and advisor profile
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/SafeUser' }
                      student: { type: [object, 'null'], additionalProperties: true }
                      advisor: { type: [object, 'null'], additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current password and revoke all sessions
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 128 }
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: Lower + upper + digit + symbol.
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link (always returns the same message)
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Generic acknowledgement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Consume a reset token and set a new password
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 16, maxLength: 512 }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password reset; all sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List the caller's refresh sessions
      responses:
        '200':
          description: Session metadata (never token hashes).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        user_agent: { type: [string, 'null'] }
                        ip: { type: [string, 'null'] }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        revoked_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's sessions
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Session revoked. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Student
  /api/student/profile:
    get:
      tags: [Student]
      summary: Own student profile
      responses:
        '200':
          description: Profile with department, advisor and safe user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/student/dashboard:
    get:
      tags: [Student]
      summary: Dashboard summary for a term
      parameters:
        - $ref: '#/components/parameters/Term'
        - name: week
          in: query
          schema: { type: integer, minimum: 0, maximum: 30 }
      responses:
        '200':
          description: Dashboard aggregate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/student/enrollments:
    get:
      tags: [Student]
      summary: Completed and current enrollments
      responses:
        '200':
          description: Enrollment history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/student/recommended-plan:
    get:
      tags: [Student]
      summary: Recommended (advisory) plan for a level
      parameters:
        - $ref: '#/components/parameters/Term'
        - name: level
          in: query
          schema: { type: integer, minimum: 1, maximum: 4 }
      responses:
        '200':
          description: Recommended plan rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/student/courses:
    get:
      tags: [Student]
      summary: Program structure and course catalogue
      responses:
        '200':
          description: Program information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/student/eligibility:
    get:
      tags: [Student]
      summary: Bulk eligibility for the student's candidates or explicit codes
      parameters:
        - $ref: '#/components/parameters/Term'
        - name: week
          in: query
          schema: { type: integer, minimum: 0, maximum: 30 }
        - name: courseCodes
          in: query
          description: Comma-separated course codes (max 100).
          schema: { type: string, maxLength: 800 }
        - name: plannedCredits
          in: query
          schema: { type: integer, minimum: 0, maximum: 21 }
      responses:
        '200':
          description: Decisions plus the load decision and any escalations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EligibilityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/student/eligibility/{courseCode}:
    get:
      tags: [Student]
      summary: Eligibility for one course
      parameters:
        - $ref: '#/components/parameters/CourseCode'
        - $ref: '#/components/parameters/Term'
        - name: plannedCredits
          in: query
          schema: { type: integer, minimum: 0, maximum: 21 }
      responses:
        '200':
          description: Single decision with traceability fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/student/standing:
    get:
      tags: [Student]
      summary: Academic standing, warnings, probation and dismissal risk
      parameters: [{ $ref: '#/components/parameters/Term' }]
      responses:
        '200':
          description: Standing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Standing' }
  /api/student/early-warning:
    get:
      tags: [Student]
      summary: Early-warning risk assessment
      parameters: [{ $ref: '#/components/parameters/Term' }]
      responses:
        '200':
          description: Risk signals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EarlyWarning' }
  /api/student/graduation-audit:
    get:
      tags: [Student]
      summary: Graduation audit
      parameters: [{ $ref: '#/components/parameters/Term' }]
      responses:
        '200':
          description: Audit result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GraduationAudit' }
  /api/student/gpa/simulate:
    post:
      tags: [Student]
      summary: Simulate SGPA/CGPA for planned grades
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [simulated]
              properties:
                term: { type: string }
                simulated:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [courseCode]
                    properties:
                      courseCode: { type: string, pattern: '^[A-Z]{3}[0-9]{4}$' }
                      percentage: { type: [number, 'null'], minimum: 0, maximum: 100 }
                      gradeLetter: { type: [string, 'null'], minLength: 1, maxLength: 2 }
                futureCgpaTarget: { type: [number, 'null'], minimum: 0, maximum: 4 }
      responses:
        '200':
          description: Simulated GPA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/student/whatif/major-switch:
    post:
      tags: [Student]
      summary: Estimate transferable credits for another program
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetProgram]
              properties:
                targetProgram: { type: string, enum: [CS, IT, AI, DS] }
      responses:
        '200':
          description: What-if result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/student/plans:
    get:
      tags: [Student]
      summary: List own study plans
      responses:
        '200':
          description: Plans newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
    post:
      tags: [Student]
      summary: Generate an advisory DRAFT plan
      description: |
        Deterministic generator. The plan is capped at the resolved maximum
        load, is persisted as `DRAFT` and is never a registration. Every item
        carries its own eligibility decision.
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                term: { type: string }
                week: { type: integer, minimum: 0, maximum: 30 }
                maxCredits: { type: integer, minimum: 0, maximum: 21 }
                planningSlot: { type: string, pattern: '^[1-4]-[12]$' }
                preferences:
                  type: object
                  additionalProperties: false
                  properties:
                    avoid_days:
                      type: array
                      items: { type: string, enum: [sat, sun, mon, tue, wed, thu, fri] }
                    compress_days: { type: boolean }
                    prefer_morning: { type: boolean }
      responses:
        '201':
          description: Draft plan created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Plan' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/student/plans/{id}:
    get:
      tags: [Student]
      summary: Get one own plan (foreign IDs return 404)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Plan with items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/student/plans/{id}/submit:
    post:
      tags: [Student]
      summary: Submit a DRAFT plan to the advisor
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Plan is now SUBMITTED.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/student/plans/{id}/export:
    get:
      tags: [Student]
      summary: Download the plan as a PDF with a signed QR code
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: PDF attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/student/advisor:
    get:
      tags: [Student]
      summary: Assigned advisor and office hours
      responses:
        '200':
          description: Advisor profile and slots.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
  /api/student/office-hours/requests:
    get:
      tags: [Student]
      summary: List own office-hour requests
      responses:
        '200':
          description: Requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
    post:
      tags: [Student]
      summary: Request an office-hour slot from the assigned advisor
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slotId]
              properties:
                slotId: { type: string, format: uuid }
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/student/notifications:
    get:
      tags: [Student]
      summary: List notifications
      parameters:
        - name: unread
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/student/notifications/{id}/read:
    patch:
      tags: [Student]
      summary: Mark one notification as read
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Marked read. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/student/notifications/read-all:
    post:
      tags: [Student]
      summary: Mark all notifications as read
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: Number of updated rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }

  # ---------------------------------------------------------------- Advisor
  /api/advisor/dashboard:
    get:
      tags: [Advisor]
      summary: Advisor workload and risk summary
      responses:
        '200':
          description: Dashboard aggregate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/advisor/students:
    get:
      tags: [Advisor]
      summary: List assigned students
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated assigned students.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StudentProfile' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
  /api/advisor/at-risk:
    get:
      tags: [Advisor]
      summary: Assigned students at academic risk
      responses:
        '200':
          description: At-risk roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
  /api/advisor/students/{id}:
    get:
      tags: [Advisor]
      summary: Assigned student detail
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Profile, enrollments, latest standing and plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/advisor/students/{id}/standing:
    get:
      tags: [Advisor]
      summary: Assigned student's standing
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Term'
      responses:
        '200':
          description: Standing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Standing' }
  /api/advisor/students/{id}/eligibility:
    get:
      tags: [Advisor]
      summary: Assigned student's bulk eligibility
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Term'
        - name: courseCodes
          in: query
          schema: { type: string, maxLength: 800 }
      responses:
        '200':
          description: Decisions for the student.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EligibilityResponse' }
  /api/advisor/students/{id}/graduation-audit:
    get:
      tags: [Advisor]
      summary: Assigned student's graduation audit
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Term'
      responses:
        '200':
          description: Audit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GraduationAudit' }
  /api/advisor/students/{id}/early-warning:
    get:
      tags: [Advisor]
      summary: Assigned student's early warning
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Term'
      responses:
        '200':
          description: Risk signals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EarlyWarning' }
  /api/advisor/students/{id}/notes:
    get:
      tags: [Advisor]
      summary: Notes visible to the advisor
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
    post:
      tags: [Advisor]
      summary: Add an advising note
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
