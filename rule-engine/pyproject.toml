[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bua-aidm-rule-engine"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "psycopg[binary]==3.2.3",
  "pgvector==0.3.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.2", "httpx==0.28.1", "pypdf==6.14.2", "pymupdf==1.25.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["app/main.py", "app/rag/store.py"]
